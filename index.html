<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="Cruce is Git coordination for parallel agentic development: durable workspaces, exact revisions and human-approved promotion into canonical Git." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Cruce · Git coordination for parallel agentic development</title>
		<style>
			/* Match the public/session surface before styles and JavaScript arrive. */
			html, body { margin: 0; background: #f5f5ef; }
		</style>
		<script>
			// Apply the saved appearance before first paint; src/ui/theme.ts keeps it in sync afterwards.
			try {
				const saved = localStorage.getItem("cruce.appearance");
				const theme = saved === "dark" || saved === "light" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch {
				// Without storage the stylesheet follows the system scheme.
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/ui/main.tsx"></script>
	</body>
</html>
