<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790"><title>Cruce identity study</title><rect width="900" height="790" fill="#F5F5EF"/><g fill="#17251F" font-family="Arial, sans-serif"><text x="40" y="64" font-size="34" font-weight="600">Independent paths. One identity.</text><text x="40" y="99" font-size="15">Cruce / Geometric studies · October 2026</text><g transform="translate(40 155)"><text font-size="12" letter-spacing="1.5">01 / JUNCTION</text><g transform="translate(0 25) scale(2.7)" fill="none" stroke="#17251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 22 20M5 26 27 6"/><circle cx="16" cy="16" r="3" fill="#F5F5EF"/></g><text y="145" font-size="13">Direct, but an X loses provenance.</text></g><g transform="translate(480 155)"><text font-size="12" letter-spacing="1.5">02 / APEX</text><g transform="translate(0 25) scale(2.7)" fill="none" stroke="#17251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24 16 6 29 24ZM3 24h26"/><circle cx="16" cy="6" r="2"/></g><text y="145" font-size="13">Cultural echo; too literal on its own.</text></g><g transform="translate(40 390)"><text font-size="12" letter-spacing="1.5">03 / INTERLACED</text><g transform="translate(0 25) scale(2.7)" fill="none" stroke="#17251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25 14.3 6.8Q16 3.8 17.7 6.8L28 25"/><path d="M3 14h3m5 3 2.2 3.2q2.8 4 5.6 0L21 17m5-3h3"/></g><text y="145" font-size="13">Selected. Independent paths stay legible.</text></g><g transform="translate(480 390)"><text font-size="12" letter-spacing="1.5">04 / LETTERMARK</text><g transform="translate(0 25) scale(2.7)" fill="none" stroke="#17251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 8Q5-2 5 16t22 8M14 8l14 16m-14 0L28 8"/></g><text y="145" font-size="13">Recognizable C; a more forced crossing.</text></g><path d="M40 635h820" stroke="#CBD2C7"/><text x="40" y="672" font-size="12" letter-spacing="1.5">OPTICAL SIZES / 16 · 24 · 32</text><g transform="translate(40 704) scale(0.5)" fill="none" stroke="#17251F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25 14.3 6.8Q16 3.8 17.7 6.8L28 25"/><path d="M3 14h3m5 3 2.2 3.2q2.8 4 5.6 0L21 17m5-3h3"/></g><g transform="translate(104 704) scale(0.75)" fill="none" stroke="#17251F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25 14.3 6.8Q16 3.8 17.7 6.8L28 25"/><path d="M3 14h3m5 3 2.2 3.2q2.8 4 5.6 0L21 17m5-3h3"/></g><g transform="translate(168 704) scale(1.0)" fill="none" stroke="#17251F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25 14.3 6.8Q16 3.8 17.7 6.8L28 25"/><path d="M3 14h3m5 3 2.2 3.2q2.8 4 5.6 0L21 17m5-3h3"/></g><text x="280" y="724" font-size="14">A crossing is a relationship. A gap preserves identity.</text></g></svg>
